version: 2

sources:
  - name: crypto_analytics
    database: coin-49
    schema: crypto_analytics_us

    tables:
      - name: raw_coingecko
      - name: raw_fear_greed

models:

  - name: stg_coingecko
    description: Cleaned CoinGecko data

    columns:
      - name: id
        tests:
          - not_null

      - name: symbol
        tests:
          - not_null

      - name: price_usd
        tests:
          - not_null

  - name: stg_fear_greed
    description: Fear and Greed sentiment data

    columns:
      - name: fear_greed_value
        tests:
          - not_null